<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title if title else "MONOLITH yönetim" }}</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08111b; color: #e6edf3; }
        * { box-sizing: border-box; } body { margin: 0; background: radial-gradient(circle at top, #12304a, #08111b 55%); min-height: 100vh; }
        main, .max-w-md { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
        .min-h-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .max-w-md { max-width: 460px; padding: 0; } .glass, .glass-light { background: #0d1b2a; border: 1px solid #29435a; border-radius: 14px; }
        .glass { padding: 24px; } .glass-light { margin-top: 14px; padding: 14px; }
        h1, h2 { color: #f3f7fa; } p { color: #a9b8c6; line-height: 1.55; } a { color: #7dd3fc; }
        form { margin: 18px 0; } label { display: block; margin: 12px 0 6px; font-weight: 650; }
        input, textarea, button { width: 100%; padding: 11px; border: 1px solid #36536d; border-radius: 8px; background: #07131f; color: #e6edf3; }
        button { width: auto; margin-top: 12px; background: #2dd4bf; color: #05201d; font-weight: 700; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 11px; border-bottom: 1px solid #29435a; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; } .text-center { text-align: center; } .hidden, [hidden] { display: none !important; }
        .container { width: min(1100px, calc(100% - 32px)); margin: 0 auto; } .rounded-xl, .rounded-2xl { border-radius: 14px; }
        .grid { display: grid; gap: 12px; } .mb-6, .mb-7, .mb-8 { margin-bottom: 24px; } .mt-4, .mt-5 { margin-top: 16px; }
        .p-4, .p-5, .p-6, .p-8 { padding: 20px; } .font-mono { font-family: ui-monospace, Consolas, monospace; }
        @media (min-width: 720px) { .sm\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); } }
    </style>
    {% block head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
